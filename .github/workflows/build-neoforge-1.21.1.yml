name: Build NeoForge 1.21.1

on:
  push:
    branches:
      - 1.21.1-config
  workflow_dispatch:

concurrency:
  group: build-neoforge-1.21.1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-neoforge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build NeoForge mod
        run: bash ./gradlew :neoforge:build --no-daemon
      - name: Upload NeoForge jar
        uses: actions/upload-artifact@v4
        with:
          name: classicpipes-neoforge-minecraft-1.21.1
          path: neoforge/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
